[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sequentialist-visuals"
version = "0.0.1"
description = "Portable read-only views of search provenance and participant events"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sequentialist.visuals*"]
namespaces = true

[tool.setuptools.package-data]
"sequentialist.visuals" = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src/sequentialist"]
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
